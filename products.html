<script>
const PRODUCT_API = "https://script.google.com/macros/s/AKfycbxsMa2lo42bcs36DvEyR-_EFM24tYnB8OuBvlRU94Y7jNcz0cxbcvbX7ripAeFwsVApug/exec";
const CACHE_KEY = "dishariProductsCacheV1";

let allProducts = [];
let globalSale = null;
let currentProduct = null;
let currentSlide = 0;
let viewingTimer = null;
let selectedPopupSize = "";

let selectedCategory = "All";
let selectedPriceRange = "all";
let searchValue = "";

let orderToastTimer = null;
let orderToastHideTimer = null;

let user = localStorage.getItem("user");
if(!user){
window.location.href = "login.html";
}

let hour = new Date().getHours();
let greeting = "";
if(hour < 12){
greeting = "Good Morning";
}
else if(hour < 17){
greeting = "Good Afternoon";
}
else{
greeting = "Good Evening";
}
document.getElementById("welcome").innerText = greeting + ", " + user;

function logout(){
localStorage.removeItem("user");
window.location.href = "login.html";
}

function toggleProfileMenu(){
let menu = document.getElementById("profileMenu");
menu.style.display = menu.style.display == "block" ? "none" : "block";
}

function normalizeImageUrl(url){
if(!url){
return "";
}

let cleanUrl = String(url).trim();
let driveMatch =
cleanUrl.match(/drive\.google\.com\/file\/d\/([^/]+)/) ||
cleanUrl.match(/[?&]id=([^&]+)/);

if(driveMatch && driveMatch[1]){
return "https://lh3.googleusercontent.com/d/" + driveMatch[1];
}

return cleanUrl;
}

function imageLoaded(img){
img.classList.add("loaded");
}

function getProductPrice(product){
let priceText = String(product["Price"] || "0").replace(/[^\d.]/g,"");
return Number(priceText) || 0;
}

function renderLoadingState(){
let categoryHTML = "";
for(let i = 0; i < 4; i++){
categoryHTML += `<div class="category-skeleton"></div>`;
}
document.getElementById("categories").innerHTML = categoryHTML;

let productHTML = "";
for(let i = 0; i < 4; i++){
productHTML += `
<div class="product-skeleton">
<div class="skeleton-img"></div>
<div class="skeleton-line short"></div>
<div class="skeleton-line medium"></div>
<div class="skeleton-line price"></div>
<div class="skeleton-line"></div>
<div class="skeleton-button"></div>
</div>
`;
}
document.getElementById("mainProducts").innerHTML = productHTML;
}

function prepareVisibleProducts(data){
return data.filter(product => {
let showValue = (product["Show"] || "").toString().trim().toLowerCase();
return showValue === "yes" || showValue === "new";
});
}

function findGlobalSale(data){
let saleColumns = [
{key:"Big Day Sale", label:"Big Day Sale"},
{key:"Festive Discount", label:"Festive Discount"},
{key:"Flat Discount", label:"Flat Discount"}
];

for(let sale of saleColumns){

let rowWithSale = data.find(item => Number(item[sale.key]) > 0);

if(rowWithSale){
return {
label:sale.label,
percent:Number(rowWithSale[sale.key])
};
}

}

return null;
}

function renderStore(data, fromCache){
allProducts = prepareVisibleProducts(data);
globalSale = findGlobalSale(data);
loadCategories(allProducts);
applyFilters();

if(!fromCache){
localStorage.setItem(CACHE_KEY, JSON.stringify({
savedAt: Date.now(),
data: data
}));
}

startOrderToast();
}

function loadCachedStore(){
let cached = localStorage.getItem(CACHE_KEY);
if(!cached){
return false;
}

try{
let parsed = JSON.parse(cached);
if(Array.isArray(parsed.data)){
renderStore(parsed.data, true);

function productMatchesPrice(product){
let price = getProductPrice(product);

if(selectedPriceRange === "under199"){
return price < 200;
}

if(selectedPriceRange === "200to500"){
return price >= 200 && price <= 500;
}

if(selectedPriceRange === "501to800"){
return price >= 501 && price <= 800;
}

if(selectedPriceRange === "801plus"){
return price >= 801;
}

return true;
}

function productMatchesSearch(product){
if(searchValue === ""){
return true;
}

let name = (product["Product Name"] || "").toLowerCase();
let category = (product["Category"] || "").toLowerCase();
let desc = (product["Description1"] || "").toLowerCase();
let id = (product["Product ID"] || "").toLowerCase();

return name.includes(searchValue) ||
category.includes(searchValue) ||
desc.includes(searchValue) ||
id.includes(searchValue);
}

function applyFilters(){
let filtered = allProducts.filter(product => {
let categoryMatch = selectedCategory === "All" || product.Category === selectedCategory;
return categoryMatch && productMatchesPrice(product) && productMatchesSearch(product);

function getProductPriceForViewer(product){
let priceText = String(product["Price"] || "0").replace(/[^\d.]/g,"");
let price = Number(priceText) || 0;
return price;
}

function getViewerSettingsByPrice(price){
if(price < 200){
return {
min:1,
max:250,
step:5
};
}

if(price >= 200 && price <= 500){
return {
min:80,
max:650,
step:9
};
}

if(price >= 501 && price <= 800){
return {
min:180,
max:1100,
step:14
};
}

return {
min:300,
max:1800,
step:22
};
}

function getShoppingTimePower(){
let hour = new Date().getHours();

if(hour >= 2 && hour < 6){
return 0.25;
}

if(hour >= 6 && hour < 9){
return 0.45;
}

if(hour >= 9 && hour < 12){
return 0.65;
}

if(hour >= 12 && hour < 16){
return 0.75;
}

if(hour >= 16 && hour < 20){
return 0.9;
}

if(hour >= 20 && hour < 23){
return 1;
}

return 0.6;
}

function hashText(text){
let hash = 0;
text = String(text || "");

for(let i = 0; i < text.length; i++){
hash = ((hash << 5) - hash) + text.charCodeAt(i);
hash = hash & hash;
}

return Math.abs(hash);
}

function seededRandom(seed){
let value = Math.sin(seed) * 10000;
return value - Math.floor(value);
}

function getStartingViewerCount(product){
let price = getProductPriceForViewer(product);
let settings = getViewerSettingsByPrice(price);

let productKey =
(product["Product ID"] || "") +
(product["Product Name"] || "") +
(product["Category"] || "");

let timeBlock = Math.floor(Date.now() / (3 * 60 * 1000));
let seed = hashText(productKey + timeBlock);

let randomValue = seededRandom(seed);
let timePower = getShoppingTimePower();

let adjustedRandom = (randomValue * 0.65) + (timePower * 0.35);

let count = Math.floor(
settings.min + adjustedRandom * (settings.max - settings.min)
);

return {
count:count,
settings:settings
};
}

function startViewingCounter(product){
if(viewingTimer){
clearInterval(viewingTimer);
}

let viewerData = getStartingViewerCount(product);
let viewCount = viewerData.count;
let settings = viewerData.settings;

function updateViewingText(){
document.getElementById("popupDesc").innerText =
(product["Description2"] || "") +
"\n\nFree Shipping on Prepaid" +
"\n\nNow " + viewCount + " people viewing this product";
}

updateViewingText();

viewingTimer = setInterval(function(){
let movement = Math.floor(Math.random() * (settings.step * 2 + 1)) - settings.step;

if(movement === 0){
movement = 1;
}

viewCount = viewCount + movement;

if(viewCount < settings.min){
viewCount = settings.min + Math.floor(Math.random() * settings.step);
}

if(viewCount > settings.max){
viewCount = settings.max - Math.floor(Math.random() * settings.step);
}

updateViewingText();
},4000);
}

const orderToastTimes = [
"just now",
"2 minutes ago",
"5 minutes ago",
"8 minutes ago"
];

function getTodayKey(){
let date = new Date();
return date.getFullYear() + "-" + (date.getMonth() + 1) + "-" + date.getDate();
}

function getUsedToastProducts(){
let key = "dishariUsedToastProducts_" + getTodayKey();
return JSON.parse(localStorage.getItem(key)) || [];
}

function saveUsedToastProduct(productId){
let key = "dishariUsedToastProducts_" + getTodayKey();
let used = getUsedToastProducts();

if(!used.includes(productId)){
used.push(productId);
}

localStorage.setItem(key, JSON.stringify(used));
}

function pickToastProduct(){
let used = getUsedToastProducts();

let inStockProducts = allProducts.filter(product => {
let stock = (product["Stock"] || "").toLowerCase();
let id = product["Product ID"] || product["Product Name"];
return (stock === "yes" || stock === "in stock") && !used.includes(id);
});

let availableProducts = inStockProducts.length ? inStockProducts : allProducts.filter(product => {
let id = product["Product ID"] || product["Product Name"];
return !used.includes(id);
});

if(!availableProducts.length){
localStorage.removeItem("dishariUsedToastProducts_" + getTodayKey());
availableProducts = allProducts;
}

if(!availableProducts.length){
return null;
}

let product = availableProducts[Math.floor(Math.random() * availableProducts.length)];
let productId = product["Product ID"] || product["Product Name"];
saveUsedToastProduct(productId);

return product;
}

function getNextToastDelay(){
let chance = Math.random();

if(chance < 0.5){
return 70000 + Math.floor(Math.random() * 20000);
}

if(chance < 0.8){
return 160000 + Math.floor(Math.random() * 60000);
}

return 300000 + Math.floor(Math.random() * 120000);
}

},visibleTime);
}

function scheduleNextOrderToast(){
if(orderToastTimer){
clearTimeout(orderToastTimer);
}

orderToastTimer = setTimeout(showOrderToast, getNextToastDelay());
}

function startOrderToast(){

}

}
