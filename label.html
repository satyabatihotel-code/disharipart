<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dishari Label</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0f2f5;
color:#111;
min-height:100vh;
padding:16px;
}

.page{
max-width:760px;
margin:auto;
}

.top-title{
font-size:28px;
font-weight:900;
color:#1877F2;
margin-bottom:14px;
}

.card{
background:white;
border-radius:24px;
padding:16px;
box-shadow:0 8px 22px rgba(0,0,0,0.08);
margin-bottom:16px;
}

.input-title{
font-size:15px;
font-weight:900;
margin-bottom:8px;
color:#071d33;
}

.input-box{
height:52px;
border:1px solid #d8e0ef;
background:#f8f9fb;
border-radius:16px;
display:flex;
align-items:center;
gap:10px;
padding:0 14px;
}

.input-box i{
color:#1877F2;
}

.input-box input{
width:100%;
height:100%;
border:none;
outline:none;
background:none;
font-size:15px;
font-weight:800;
}

.action-btn{
width:100%;
min-height:54px;
margin-top:12px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#1877F2,#0f6be8);
color:white;
font-size:16px;
font-weight:900;
display:flex;
align-items:center;
justify-content:center;
gap:9px;
cursor:pointer;
box-shadow:0 8px 18px rgba(24,119,242,0.26);
}

.secondary-btn{
background:#f3f8ff;
color:#1877F2;
border:1px solid #b9d7ff;
box-shadow:none;
}

.whatsapp-btn{
background:linear-gradient(135deg,#25D366,#16a34a);
box-shadow:0 8px 18px rgba(37,211,102,0.22);
}

.toast{
position:fixed;
left:16px;
right:16px;
bottom:22px;
height:54px;
max-width:760px;
margin:auto;
background:linear-gradient(135deg,#1877F2,#0f6be8);
color:white;
border-radius:16px;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
opacity:0;
pointer-events:none;
transition:0.25s;
z-index:9999;
}

.toast.show{
opacity:1;
}

.label-wrap{
display:none;
}

.label{
width:100%;
max-width:420px;
background:white;
border:2px solid #111;
padding:14px;
margin:0 auto 16px;
color:#111;
}

.label-head{
display:flex;
justify-content:space-between;
gap:12px;
align-items:flex-start;
border-bottom:2px solid #111;
padding-bottom:10px;
margin-bottom:10px;
}

.brand{
font-size:28px;
font-weight:900;
color:#1877F2;
line-height:30px;
}

.label-small{
font-size:11px;
line-height:16px;
color:#333;
font-weight:700;
}

.qr{
width:96px;
height:96px;
border:1px solid #ddd;
padding:3px;
object-fit:contain;
}

.block{
border-bottom:1px dashed #999;
padding:9px 0;
}

.block:last-child{
border-bottom:none;
}

.block-title{
font-size:13px;
font-weight:900;
letter-spacing:0.4px;
margin-bottom:6px;
background:#111;
color:white;
display:inline-block;
padding:4px 8px;
border-radius:6px;
}

.line{
font-size:14px;
line-height:22px;
display:flex;
gap:6px;
}

.line b{
min-width:92px;
font-weight:900;
}

.big{
font-size:17px;
font-weight:900;
line-height:24px;
}

.total{
font-size:22px;
font-weight:900;
color:#1877F2;
}

.print-row{
display:grid;
grid-template-columns:1fr;
gap:10px;
max-width:420px;
margin:0 auto;
}

button,
[role="button"]{
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none;
-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
}

@media print{
body{
background:white;
padding:0;
}

.no-print{
display:none!important;
}

.label-wrap{
display:block!important;
}

.label{
width:100mm;
max-width:none;
margin:0;
border:2px solid #111;
box-shadow:none;
page-break-inside:avoid;
}

@page{
size:100mm 150mm;
margin:6mm;
}
}
</style>
</head>

<body>

<div class="page">

<div class="no-print">
<div class="top-title">Dishari Label</div>

<div class="card" id="pinCard">
<div class="input-title">Seller PIN</div>
<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="sellerPin" placeholder="Enter seller PIN" inputmode="numeric">
</div>
<button class="action-btn" type="button" onclick="unlockSeller()">
<i class="fa-solid fa-unlock"></i>
Open Label Tool
</button>
</div>

<div class="card" id="searchCard" style="display:none;">
<div class="input-title">Search by Order ID or Phone</div>
<div class="input-box">
<i class="fa-solid fa-magnifying-glass"></i>
<input type="text" id="searchInput" placeholder="Order ID or phone number">
</div>
<button class="action-btn" type="button" onclick="findOrder()">
<i class="fa-solid fa-print"></i>
Find Label
</button>
</div>
</div>

<div class="label-wrap" id="labelWrap">
<div class="label" id="printLabel"></div>

<div class="print-row no-print">
<button class="action-btn" onclick="window.print()">
<i class="fa-solid fa-print"></i>
Print Label
</button>
<button class="action-btn" onclick="downloadLabel()">
<i class="fa-solid fa-download"></i>
Download Label Image
</button>
<button class="action-btn whatsapp-btn" onclick="shareLabelText()">
<i class="fa-brands fa-whatsapp"></i>
Share Print Request
</button>
<button class="action-btn secondary-btn" onclick="clearLabel()">
<i class="fa-solid fa-rotate-left"></i>
Search Again
</button>
</div>
</div>

</div>

<div class="toast" id="toast"></div>

<script>
const ORDER_API = "https://script.google.com/macros/s/AKfycbxsMa2lo42bcs36DvEyR-_EFM24tYnB8OuBvlRU94Y7jNcz0cxbcvbX7ripAeFwsVApug/exec?type=orders";
const SELLER_PIN = "7044";

let allOrders = [];
let currentOrder = null;

function showToast(message){
let toast = document.getElementById("toast");
toast.innerText = message;
toast.classList.add("show");

setTimeout(function(){
toast.classList.remove("show");
},2000);
}

function unlockSeller(){
alert("button clicked");  
let pin = document.getElementById("sellerPin").value.trim();

if(pin !== SELLER_PIN){
showToast("Wrong PIN");
return;
}

sessionStorage.setItem("dishariSellerUnlocked","yes");
document.getElementById("pinCard").style.display = "none";
document.getElementById("searchCard").style.display = "block";
}

if(sessionStorage.getItem("dishariSellerUnlocked") === "yes"){
document.getElementById("pinCard").style.display = "none";
document.getElementById("searchCard").style.display = "block";
}

function getField(order,names){
for(let i = 0; i < names.length; i++){
if(order[names[i]] !== undefined && order[names[i]] !== null){
return order[names[i]];
}
}
return "";
}

function normalizeOrder(order){
return {
orderId:getField(order,["Order ID","orderId"]),
dateTime:getField(order,["Date Time","dateTime"]),
name:getField(order,["Customer Name","customerName"]),
phone:String(getField(order,["Phone Number","phoneNumber"])).replace(/\D/g,""),
village:getField(order,["Village","village"]),
policeStation:getField(order,["Police Station","policeStation"]),
district:getField(order,["District","district"]),
pinCode:getField(order,["Pin Code","pinCode"]),
landmark:getField(order,["Landmark","landmark"]),
productIds:getField(order,["Product IDs","productIds"]),
productNames:getField(order,["Product Names","productNames"]),
sizes:getField(order,["Sizes","sizes"]),
quantities:getField(order,["Quantities","quantities"]),
productPrices:getField(order,["Product Prices","productPrices"]),
shipping:getField(order,["Shipping","shipping"]),
orderTotal:getField(order,["Order Total","orderTotal"]),
status:getField(order,["Status","status"])
};
}

function orderSortValue(order){
return Number(String(order.orderId || "").replace(/\D/g,"")) || 0;
}

async function loadOrders(){
let response = await fetch(ORDER_API);
let data = await response.json();

if(Array.isArray(data)){
allOrders = data.map(normalizeOrder);
}
else if(Array.isArray(data.orders)){
allOrders = data.orders.map(normalizeOrder);
}
else{
allOrders = [];
}
}

function money(value){
let number = Number(String(value || "0").replace(/[^\d.]/g,"")) || 0;
return "₹" + Math.round(number).toLocaleString("en-IN");
}

async function findOrder(){
let query = document.getElementById("searchInput").value.trim();

if(!query){
showToast("Enter Order ID or Phone");
return;
}

if(!allOrders.length){
try{
await loadOrders();
}
catch(error){
showToast("Could not load orders");
return;
}
}

let cleanQuery = query.replace(/\D/g,"").toLowerCase();
let textQuery = query.toLowerCase();

let matched = allOrders.filter(order=>{
return String(order.orderId).toLowerCase().includes(textQuery) || order.phone.includes(cleanQuery);
});

matched.sort((a,b)=>orderSortValue(b) - orderSortValue(a));

if(!matched.length){
showToast("No order found");
return;
}

renderLabel(matched[0]);
}

function renderLabel(order){
currentOrder = order;

let qrText = [
"Dishari",
"Order ID: " + order.orderId,
"Phone: " + order.phone,
"Total: " + money(order.orderTotal)
].join(" | ");

let qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=" + encodeURIComponent(qrText);

document.getElementById("printLabel").innerHTML = `
<div class="label-head">
<div>
<div class="brand">Dishari</div>
<div class="label-small">Fashion Order Parcel Label</div>
<div class="label-small">Order ID: ${order.orderId || "-"}</div>
<div class="label-small">${order.dateTime || ""}</div>
</div>
<img class="qr" src="${qrUrl}" crossorigin="anonymous">
</div>

<div class="block">
<div class="block-title">SHIP TO</div>
<div class="line big"><b>Name:</b><span>${order.name || "-"}</span></div>
<div class="line big"><b>Phone:</b><span>${order.phone || "-"}</span></div>
<div class="line"><b>Village:</b><span>${order.village || "-"}</span></div>
<div class="line"><b>Police:</b><span>${order.policeStation || "-"}</span></div>
<div class="line"><b>District:</b><span>${order.district || "-"}</span></div>
<div class="line"><b>Pin Code:</b><span>${order.pinCode || "-"}</span></div>
<div class="line"><b>Landmark:</b><span>${order.landmark || "-"}</span></div>
</div>

<div class="block">
<div class="block-title">ORDER DETAILS</div>
<div class="line"><b>Product ID:</b><span>${order.productIds || "-"}</span></div>
<div class="line"><b>Product:</b><span>${order.productNames || "-"}</span></div>
<div class="line"><b>Size:</b><span>${order.sizes || "-"}</span></div>
<div class="line"><b>Qty:</b><span>${order.quantities || "-"}</span></div>
<div class="line"><b>Price:</b><span>${order.productPrices || "-"}</span></div>
</div>

<div class="block">
<div class="line"><b>Shipping:</b><span>${order.shipping || "Free"}</span></div>
<div class="line"><b>Status:</b><span>${order.status || "-"}</span></div>
<div class="line"><b>Total:</b><span class="total">${money(order.orderTotal)}</span></div>
</div>

<div class="label-small" style="text-align:center;margin-top:8px;">
Thank you for shopping with Dishari
</div>
`;

document.getElementById("labelWrap").style.display = "block";
}

function downloadLabel(){
let label = document.getElementById("printLabel");

if(!currentOrder){
showToast("Find an order first");
return;
}

html2canvas(label,{
backgroundColor:"#ffffff",
scale:2,
useCORS:true
}).then(function(canvas){
let link = document.createElement("a");
link.download = "Dishari_Label_" + (currentOrder.orderId || "order") + ".png";
link.href = canvas.toDataURL("image/png");
link.click();
showToast("Label downloaded");
}).catch(function(){
showToast("Download failed");
});
}

function shareLabelText(){
if(!currentOrder){
showToast("Find an order first");
return;
}

let message =
"Please print this Dishari parcel label.%0A" +
"Order ID: " + encodeURIComponent(currentOrder.orderId || "") + "%0A" +
"Customer: " + encodeURIComponent(currentOrder.name || "") + "%0A" +
"Phone: " + encodeURIComponent(currentOrder.phone || "") + "%0A" +
"Total: " + encodeURIComponent(money(currentOrder.orderTotal)) + "%0A%0A" +
"I will send the downloaded label image here.";

window.location.href = "https://wa.me/?text=" + message;
}

function clearLabel(){
document.getElementById("labelWrap").style.display = "none";
document.getElementById("searchInput").value = "";
document
